name: ponkun-fish-proxy-secret-validation-18002

services:
  fish-cloud-proxy-secret-validation:
    build:
      context: .
      dockerfile: Dockerfile.secure
    image: ponkun-fish-cloud-proxy:secure-secret-validation-18002
    container_name: ponkun-fish-cloud-proxy-secret-validation-18002
    user: "65532:65532"
    ports:
      - "127.0.0.1:18002:8000"
    environment:
      FISH_AUDIO_API_KEY_FILE: /run/ponkun-secrets/fish_audio_api_key
    secrets:
      - source: fish_audio_api_key
        target: /run/compose-secrets/fish_audio_api_key
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /run/ponkun-secrets:rw,noexec,nosuid,nodev,mode=0700,uid=65532,gid=65532
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"

secrets:
  fish_audio_api_key:
    file: ${FISH_AUDIO_API_KEY_SECRET_FILE:?set the GUI-managed secret path}
